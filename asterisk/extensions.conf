[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; Pulls in [zorkpbx-inbound] (extension 5001) from the upstream repo's
; dialplan snippet, copied to /etc/asterisk/extensions_zorkpbx.conf at
; build time. See that file for the AGI(zorkpbx.py) details.
#include extensions_zorkpbx.conf

; Context used by the SIP endpoint defined in pjsip.conf. `include =>`
; imports zorkpbx-inbound's extensions (5001, ...) here so a registered
; phone can just dial 5001.
[internal]
include => zorkpbx-inbound
