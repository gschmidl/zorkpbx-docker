# Runs the prebuilt image from GitHub Container Registry:
#   docker compose pull && docker compose up -d
#
# To build locally instead, uncomment `build:` below (or just run
# `docker compose up -d --build`).
#
# Settings come from a .env file next to this one — copy .env.example to .env
# and edit. Every value has a working default, so an empty .env is fine.

services:
  zorkpbx:
    image: ghcr.io/gschmidl/zorkpbx-docker:latest
    # build: .
    container_name: zorkpbx
    ports:
      - "5060:5060/udp"
      - "10000-10020:10000-10020/udp"
    volumes:
      # Game saves and the generated SIP password persist here.
      - ./saves:/opt/zorkpbx/saves
      # TTS cache — a named volume, because it is large, regenerable, and
      # nothing you want cluttering the repo directory.
      - zorkpbx-audio:/opt/zorkpbx/audio
    environment:
      SIP_USER: "${SIP_USER:-6001}"
      SIP_PASSWORD: "${SIP_PASSWORD:-infocom}"
      # Set to the host address your softphone dials if audio is one-way.
      SIP_EXTERNAL_IP: "${SIP_EXTERNAL_IP:-}"
      SIP_LOCAL_NET: "${SIP_LOCAL_NET:-}"
      # espeak | piper | gtts. Unset = piper when the image has it (amd64),
      # espeak otherwise.
      ZORKPBX_TTS_ENGINE: "${ZORKPBX_TTS_ENGINE:-}"
      ZORKPBX_LOG_LEVEL: "${ZORKPBX_LOG_LEVEL:-INFO}"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  zorkpbx-audio:
