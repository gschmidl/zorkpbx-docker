# Runs the prebuilt image from GitHub Container Registry:
#   docker compose pull && docker compose up -d
#
# To build locally instead, uncomment `build:` below (or run
# `docker compose up -d --build`).

services:
  zorkpbx:
    image: ghcr.io/gschmidl/zorkpbx-docker:latest
    # build: .
    container_name: zorkpbx
    ports:
      - "5060:5060/udp"
      - "10000-10020:10000-10020/udp"
    volumes:
      # Game saves persist here.
      - ./saves:/opt/zorkpbx/saves
      # TTS cache — a named volume, because it is regenerable and nothing you
      # want cluttering the repo directory.
      - zorkpbx-audio:/opt/zorkpbx/audio
    environment:
      SIP_USER: "6001"
      SIP_PASSWORD: "infocom"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  zorkpbx-audio:
