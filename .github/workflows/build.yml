name: build

# Replaces the old docker-image.yml + docker-publish.yml pair, which built the
# image twice on every push and published a single-architecture (amd64-only)
# manifest with no `latest` tag — so `docker pull ghcr.io/.../zorkpbx-docker`
# failed with "manifest unknown", and pulling `:master` on an Apple Silicon Mac
# failed with "no matching manifest for linux/arm64/v8".

on:
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master" ]
  # Weekly rebuild: every upstream ref is pinned by SHA, so the only thing that
  # moves is the Alpine base and its security updates.
  schedule:
    - cron: "40 22 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Lint shell scripts (shellcheck)
        run: shellcheck entrypoint.sh

  build:
    name: build (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture. Building linux/arm64 under QEMU on
          # an amd64 runner would take hours here — whisper.cpp is compiled from
          # source. ubuntu-24.04-arm is free for public repositories.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive a filesystem-safe platform name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed as a bare digest with no tag; the merge job
      # below stitches them into one multi-platform manifest list. provenance is
      # off so every digest is a plain single-platform image manifest, which
      # keeps the merged index to exactly two entries.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish manifest
    needs: build
    # `!cancelled()` rather than plain success(): amd64 is the platform that
    # matters, so if the arm64 leg breaks we still publish the amd64 image and
    # let the verify step below turn the run red. A broken bonus platform must
    # never block the primary one.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Completes the identity challenge with sigstore/fulcio for keyless
      # signing.
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
          # A failed platform uploads nothing; that is handled below, not here.
          if-no-files-found: ignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` was missing before, which is why an untagged
          # `docker pull ghcr.io/gschmidl/zorkpbx-docker` returned
          # "manifest unknown".
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "::error::no platform built successfully — nothing to publish"
            exit 1
          fi
          echo "Publishing ${#digests[@]} platform digest(s)."
          # Word splitting is the point here: both substitutions expand to
          # several separate arguments (-t tag1 -t tag2 ..., then one
          # image@sha256:... per built platform).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " "${digests[@]}")

      # amd64 is required; arm64 is a bonus. Missing arm64 is a red run but the
      # image is already published and usable.
      #
      # Retried because GHCR resolves a freshly pushed tag with a lag of a few
      # seconds: reading it immediately returns the *previous* index, which
      # made this step report the old amd64-only manifest and fail a run whose
      # image was in fact correct. "unknown/unknown" entries (attestation
      # manifests) are filtered out rather than counted as platforms.
      - name: Verify published platforms
        run: |
          platforms=""
          for attempt in $(seq 1 10); do
            platforms="$(docker buildx imagetools inspect \
              "${REGISTRY}/${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' 2>/dev/null \
              | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"]
                       | map(select(. != "unknown/unknown")) | join(" ")')" || platforms=""
            echo "attempt ${attempt}: ${platforms:-<none>}"
            case " ${platforms} " in
              *" linux/amd64 "*)
                case " ${platforms} " in *" linux/arm64 "*) break ;; esac ;;
            esac
            sleep 6
          done

          echo "Published platforms: ${platforms}"
          case " ${platforms} " in
            *" linux/amd64 "*) ;;
            *) echo "::error::published manifest has no linux/amd64"; exit 1 ;;
          esac
          case " ${platforms} " in
            *" linux/arm64 "*) ;;
            *) echo "::error::linux/arm64 missing - that build leg failed. The amd64 image published fine; fix arm64 and re-run."; exit 1 ;;
          esac
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      # Writes to the public Rekor transparency log; the repository and its
      # package are public, so nothing is leaked by doing so.
      - name: Sign the published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          echo "$TAGS" | xargs -I {} cosign sign --yes "{}@${digest}"
